version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: f1-race-prediction:latest
    container_name: f1_prediction_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models          # mount model artifacts
      - ./data:/app/data              # mount data directory
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: f1-race-prediction:latest
    container_name: f1_training
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: >
      sh -c "python src/data/fetch_data.py --output data/raw/races.csv &&
             python src/data/preprocess.py --input data/raw/races.csv --output data/processed/races_processed.csv &&
             python src/features/build_features.py --input data/processed/races_processed.csv --output data/processed/races_features.csv &&
             python src/models/train.py --input data/processed/races_features.csv --model-dir models"
    profiles:
      - train
