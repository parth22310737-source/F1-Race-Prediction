model:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  min_child_weight: 3
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

data:
  test_size: 0.2
  val_size: 0.1
  seasons:
    - 2018
    - 2019
    - 2020
    - 2021
    - 2022
    - 2023

strategy:
  pit_stop_undercut_window: 3
  safety_car_probability_threshold: 0.3
  tire_compounds:
    - soft
    - medium
    - hard
  soft_deg_rate: 0.12
  medium_deg_rate: 0.07
  hard_deg_rate: 0.04
  max_stint_soft: 25
  max_stint_medium: 40
  max_stint_hard: 55
